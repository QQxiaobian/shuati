name: shutibao

services:
  app:
    build:
      # 直接从 GitHub 的 docker 分支拉取源码构建，无需手动 clone
      context: https://github.com/QQxiaobian/shuati.git#docker
      dockerfile: Dockerfile
      args:
        # 默认走 DaoCloud 镜像源，避免部分 NAS 的 docker.io 加速器返回 401
        NODE_IMAGE: ${NODE_IMAGE:-docker.m.daocloud.io/library/node:24-alpine}
    restart: unless-stopped
    ports:
      - "8870:3000"
    environment:
      PORT: "3000"
      DB_PATH: /data/shutibao.db
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      TZ: Asia/Shanghai
    volumes:
      - app_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  app_data:
