<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>刷题宝</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f2f4f7;--paper:#fff;--ink:#17212f;--ink-soft:#334155;--muted:#667085;
  --line:#e3e8ef;--line-strong:#cdd6e1;
  --brand:#1e5d87;--brand-deep:#123f5d;--brand-soft:#e9f2f8;
  --accent:#d97757;--accent-soft:#fbeee8;
  --green:#2f7d5c;--green-soft:#eaf5ef;
  --amber:#95651d;--amber-soft:#fbf2df;
  --red:#b54747;--red-soft:#fbeaea;
  --radius:14px;--shadow:0 10px 30px rgba(21,42,63,.07);
}
html{scroll-behavior:smooth}
body{font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:var(--brand);text-decoration:none;cursor:pointer}
a:hover{text-decoration:underline}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
h1,h2,h3,h4{line-height:1.35}
.muted{color:var(--muted)}.small{font-size:12px}
.hidden{display:none!important}

/* ===== layout ===== */
#app{min-height:100vh}
.layout{display:flex;min-height:100vh}
.sidebar{width:220px;flex:0 0 220px;background:var(--paper);border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;border-bottom:1px solid var(--line);margin-bottom:12px}
.brand-mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(145deg,var(--brand),var(--brand-deep));color:#fff;display:grid;place-items:center;font-weight:700;font-size:17px}
.brand strong{font-size:16px}
.brand span{display:block;font-size:10px;color:var(--muted);letter-spacing:.1em}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;color:var(--ink-soft);font-size:13.5px;cursor:pointer;border:none;background:none;width:100%;text-align:left}
.nav-item:hover{background:var(--brand-soft);color:var(--brand-deep)}
.nav-item.active{background:var(--brand);color:#fff}
.nav-item .ico{width:18px;text-align:center}
.sidebar .foot{margin-top:auto;font-size:11px;color:var(--muted);padding:10px;border-top:1px solid var(--line)}
.main{flex:1;padding:26px 34px 90px;min-width:0}
.wrap{max-width:1080px;margin:0 auto}
.topbar{display:none}
.bottom-nav{display:none}

/* ===== components ===== */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;box-shadow:0 3px 12px rgba(21,42,63,.03)}
.card+.card{margin-top:14px}
.page-title{font-size:22px;font-weight:700;letter-spacing:-.01em;margin-bottom:4px}
.page-sub{color:var(--muted);font-size:13px;margin-bottom:18px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:9px;border:1px solid var(--line-strong);background:#fff;color:var(--ink-soft);font-size:13px;transition:.15s}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-deep)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--red);border-color:#ecc9c9}
.btn.danger:hover{background:var(--red-soft);border-color:var(--red)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:4px 10px;font-size:12px;border-radius:7px}
.btn.lg{padding:11px 24px;font-size:15px}
.btn:disabled{opacity:.45;cursor:not-allowed;pointer-events:none}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;background:var(--brand-soft);color:var(--brand-deep);white-space:nowrap}
.tag.green{background:var(--green-soft);color:var(--green)}
.tag.amber{background:var(--amber-soft);color:var(--amber)}
.tag.red{background:var(--red-soft);color:var(--red)}
.tag.gray{background:#eef1f5;color:var(--muted)}
.tag.accent{background:var(--accent-soft);color:var(--accent)}

.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.field .hint{font-size:11.5px;color:var(--muted);margin-top:4px}
.input,select.input,textarea.input{width:100%;padding:9px 12px;border:1px solid var(--line-strong);border-radius:9px;background:#fff;outline:none;transition:.15s}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(30,93,135,.12)}
textarea.input{min-height:80px;resize:vertical}
.field-err{color:var(--red);font-size:12px;margin-top:4px}
.inline-fields{display:flex;gap:12px;flex-wrap:wrap}
.inline-fields .field{flex:1;min-width:140px}

.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:11px;background:#fff}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
th{text-align:left;background:#f7f9fc;padding:10px 12px;border-bottom:1px solid var(--line-strong);font-weight:650;white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--ink-soft)}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#fafcfe}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tab{padding:9px 16px;font-size:14px;color:var(--ink-soft);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--brand)}
.tab.active{color:var(--brand);border-bottom-color:var(--brand);font-weight:650}

.modal-mask{position:fixed;inset:0;background:rgba(15,25,35,.45);z-index:100;display:flex;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(2px)}
.modal{background:#fff;border-radius:16px;max-width:640px;width:100%;max-height:88vh;overflow-y:auto;padding:24px 26px;box-shadow:0 24px 60px rgba(0,0,0,.2)}
.modal.wide{max-width:900px}
.modal h3{font-size:17px;margin-bottom:14px}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}

.toast-box{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{padding:10px 20px;border-radius:10px;background:#17212f;color:#fff;font-size:13px;box-shadow:0 10px 24px rgba(0,0,0,.2);animation:tin .2s ease}
.toast.ok{background:var(--green)}.toast.err{background:var(--red)}.toast.warn{background:var(--amber)}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1}}

.empty{padding:44px 20px;text-align:center;color:var(--muted)}
.empty .big{font-size:34px;margin-bottom:8px}
.empty p{margin-bottom:14px}

.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.bank-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;display:flex;flex-direction:column;gap:8px;transition:.15s}
.bank-card:hover{border-color:#bfd1df;box-shadow:var(--shadow)}
.bank-card h4{font-size:15px}
.bank-card .meta{display:flex;gap:6px;flex-wrap:wrap}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:18px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer}
.stat:hover{border-color:var(--brand)}
.stat b{display:block;font-size:24px;color:var(--brand);font-family:Georgia,serif}
.stat span{font-size:12px;color:var(--muted)}

.pager{display:flex;gap:6px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.pager button{min-width:32px;padding:5px 10px;border:1px solid var(--line-strong);background:#fff;border-radius:7px;font-size:12.5px}
.pager button.cur{background:var(--brand);color:#fff;border-color:var(--brand)}

.filter-panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px}
.filter-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.check-row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.check-row label{display:flex;gap:5px;align-items:center;font-size:13px;color:var(--ink-soft);cursor:pointer}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft);cursor:pointer;user-select:none}
.switch input{position:absolute;opacity:0;width:0;height:0}
.switch .track{position:relative;width:38px;height:21px;border-radius:99px;background:#cdd6e1;transition:background .18s;flex:0 0 38px}
.switch .track::after{content:"";position:absolute;top:2.5px;left:2.5px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(21,42,63,.25);transition:transform .18s}
.switch input:checked+.track{background:var(--brand)}
.switch input:checked+.track::after{transform:translateX(17px)}
.switch input:focus-visible+.track{box-shadow:0 0 0 3px rgba(30,93,135,.18)}

/* practice / exam */
.q-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:24px 26px}
.q-stem{font-size:16px;font-weight:600;margin:10px 0 16px;white-space:pre-wrap}
.opt{display:flex;gap:10px;padding:11px 14px;border:1px solid var(--line-strong);border-radius:10px;margin-bottom:9px;cursor:pointer;transition:.13s;align-items:flex-start}
.opt:hover{border-color:var(--brand);background:var(--brand-soft)}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.right{border-color:var(--green);background:var(--green-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt .k{font-weight:700;color:var(--brand);flex:0 0 20px}
.feedback{border-radius:10px;padding:13px 16px;margin-top:14px;font-size:13.5px}
.feedback.ok{background:var(--green-soft);border:1px solid #cbe6d8}
.feedback.bad{background:var(--red-soft);border:1px solid #f0cccc}
.analysis-box{background:#f7f9fc;border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-top:10px;font-size:13px;white-space:pre-wrap}
.progress-line{height:6px;background:#e9edf2;border-radius:99px;overflow:hidden;margin:10px 0}
.progress-line i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .2s}
.exam-nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-top:10px;max-height:200px;overflow-y:auto;scrollbar-width:none;-ms-overflow-style:none}
.exam-nav::-webkit-scrollbar{display:none;width:0;height:0}
.exam-nav button{height:34px;border:1px solid var(--line-strong);border-radius:7px;background:#fff;font-size:12px}
.exam-nav button.done{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-deep)}
.exam-nav button.cur{outline:2px solid var(--accent)}
.timer{font-size:18px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.hl{background:#ffe9a8;padding:0 1px;border-radius:3px}

/* import wizard */
.steps{display:flex;gap:0;margin-bottom:20px;overflow-x:auto}
.step{flex:1;min-width:120px;text-align:center;padding:10px 6px;font-size:12.5px;color:var(--muted);border-bottom:2px solid var(--line)}
.step.cur{color:var(--brand);border-color:var(--brand);font-weight:650}
.step b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#e9edf2;color:var(--muted);font-size:11px;margin-right:5px}
.step.cur b{background:var(--brand);color:#fff}
.preview-table{font-size:12px;min-width:0}
.preview-table td,.preview-table th{padding:5px 8px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.map-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.sheet-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.sheet-tab{padding:6px 14px;border:1px solid var(--line-strong);border-radius:99px;background:#fff;cursor:pointer;font-size:13px}
.sheet-tab.cur{background:var(--brand);color:#fff;border-color:var(--brand)}

/* auth */
.auth-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 80% 10%,rgba(217,119,87,.12),transparent 26rem),radial-gradient(circle at 12% 80%,rgba(30,93,135,.12),transparent 26rem),var(--bg);padding:20px}
.auth-card{background:#fff;border-radius:18px;padding:36px 38px;width:100%;max-width:400px;box-shadow:var(--shadow)}
.auth-card h1{font-size:24px;margin-bottom:4px;color:var(--brand-deep)}
.auth-card .sub{color:var(--muted);font-size:13px;margin-bottom:22px}

/* responsive */
@media (max-width:820px){
  .sidebar{display:none}
  .main{padding:16px 14px 84px}
  .topbar{display:flex;align-items:center;gap:10px;background:var(--paper);border-bottom:1px solid var(--line);padding:10px 16px;position:sticky;top:0;z-index:50}
  .bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--paper);border-top:1px solid var(--line);z-index:50;padding:4px 2px}
  .bottom-nav .nav-item{flex:1;flex-direction:column;gap:2px;font-size:10.5px;padding:6px 2px;border-radius:0;text-align:center;align-items:center}
  .modal{padding:18px}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast-box" id="toastBox"></div>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="js/core.js?v=6"></script>
<script src="js/banks.js?v=3"></script>
<script src="js/import.js?v=5"></script>
<script src="js/practice.js?v=11"></script>
<script src="js/exam.js?v=11"></script>
<script src="js/search.js?v=4"></script>
<script src="js/admin.js?v=3"></script>
<script>boot();</script>
</body>
</html>
